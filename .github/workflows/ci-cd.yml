name: Cyber Security Platform CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Angular dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Lint and unit tests
        run: |
          echo "Run Python linting and tests"
          echo "Run Angular linting and tests"

  security-checks:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency vulnerability scan
        run: |
          echo "Run dependency vulnerability scan"

      - name: Secret scanning
        run: |
          echo "Run secret scanner"

      - name: IaC validation
        run: |
          echo "Run Terraform validate"

  terraform-plan:
    runs-on: ubuntu-latest
    needs: security-checks
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init
        run: |
          cd devops/terraform
          terraform init -backend=false

      - name: Terraform validate
        run: |
          cd devops/terraform
          terraform validate

      - name: Terraform plan
        run: |
          cd devops/terraform
          echo "Run terraform plan for target environment"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - name: Deploy to Dev
        run: |
          echo "Deploy to Azure Dev environment"

  deploy-demo:
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main'
    environment: demo
    steps:
      - name: Deploy to Demo
        run: |
          echo "Deploy to Azure Demo environment"
